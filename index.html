<!doctype html>
<html lang="zh-CN" data-theme="light" data-theme-preset="minimal" data-font="hybrid">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b111a" media="(prefers-color-scheme: dark)" />
    <title>OpenIDCS 虚拟化管理平台</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem('theme');
          if (mode !== 'light' && mode !== 'dark') mode = localStorage.getItem('mmui-dark-mode') === 'enabled' ? 'dark' : 'light';
          root.setAttribute('data-theme', mode);
          root.setAttribute('data-mmui-theme', mode);
          var preset = localStorage.getItem('themePreset');
          if (preset !== 'minimal' && preset !== 'tech' && preset !== 'cute') {
            var legacyPreset = localStorage.getItem('activeAnimeTheme');
            preset = legacyPreset === 'solid-tech-green' || legacyPreset === 'solid-klein-blue'
              ? 'tech'
              : legacyPreset === 'solid-warm-sunset' ? 'cute' : 'minimal';
          }
          root.setAttribute('data-theme-preset', preset);
          var font = localStorage.getItem('fontId');
          if (font === 'maple' || font === 'hybrid' || font === 'sans') root.setAttribute('data-font', font);
          if (localStorage.getItem('transparentMode') === 'true') root.setAttribute('data-transparent', 'true');
          if (localStorage.getItem('roundedMode') === 'true') root.setAttribute('data-rounded', 'true');
        } catch (e) {
          /* localStorage 不可用时静默降级到默认主题 */
        }
      })();
    </script>
  </head>
  <body>
    <!-- React应用挂载点 -->
    <div id="root"></div>
    <!-- 加载主入口文件 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
